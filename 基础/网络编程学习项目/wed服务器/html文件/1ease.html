<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>HTML互动学习页</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .note { color: #666; font-style: italic; }
  </style>
</head>
<body>
  <h1>HTML小测验</h1>
  
  <div>
    <h2>一、选择题</h2>
    <p>1. 哪个标签用于创建超链接？</p>
    <ol type="A">
      <li>&lt;link&gt;</li>
      <li>&lt;a&gt;</li>
      <li>&lt;href&gt;</li>
    </ol>
  </div>
  
  <div>
    <h2>二、填空题</h2>
    <p>HTML的全称是：<input type="text" placeholder="请输入"></p>
  </div>
  
  <div>
    <h2>三、判断题</h2>
    <label><input type="radio" name="q3"> HTML是编程语言</label><br>
    <label><input type="radio" name="q3"> HTML用于描述页面结构</label>
  </div>
  
  <button onclick="alert('提交成功！正确答案：1.B 2.超文本标记语言 3.第二个选项')">提交答案</button>
  
  <p class="note">提示：查看页面源代码可学习标签用法</p>
</body>
</html>
